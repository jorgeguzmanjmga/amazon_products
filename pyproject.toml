[project]
name = "amazon-products"
version = "0.1.0"
description = "Servidor MCP por HTTP para buscar y analizar productos de Amazon Reviews 2023 Electronics con embeddings"
readme = "README.md"
authors = [
    { name = "Jorge Guzmán", email = "jorgeguzmanjmga@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2,<3",
    "numpy>=2.5.4",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pandas>=3.0.6",
]
